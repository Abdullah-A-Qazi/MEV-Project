[project]
name = "mev-monitor"
version = "0.1.0"
description = "Detects arbitrage and sandwich MEV on Ethereum and measures profit-estimate accuracy, mempool visibility and user mitigation."
authors = [
    { name = "Abdullah Qazi", email = "abdullahqazi795@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "web3>=8.0.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "collector",
    "detectors",
    "profit",
    "mempool",
    "mitigation",
    "validation",
    "analysis",
    "common",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs a live RPC endpoint (skipped by default; run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
